{% load upload_extras %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>sevalla-django-assets</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container">
            <h3 class="mt-3">
                <a href="https://github.com/duplxey/sevalla-django-assets">sevalla-django-assets</a>
            </h3>
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">New Upload</h5>
                    <form id="uploadForm">
                        <div class="mb-3">
                            <label for="slug" class="form-label">Slug *</label>
                            <input type="text" class="form-control" id="slug" name="slug" required>
                        </div>
                        <div class="mb-3">
                            <label for="file" class="form-label">File *</label>
                            <input type="file" class="form-control" id="file" name="file" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Upload</button>
                    </form>
                    <div id="uploadResult"></div>
                    <script>
                        document.getElementById("uploadForm").addEventListener("submit", async function(e) {
                            e.preventDefault();

                            const form = e.target;
                            const formData = new FormData(form);

                            try {
                                const response = await fetch("/upload/", {
                                    method: "POST",
                                    body: formData
                                });
                                const data = await response.json();

                                // On success refresh the page, on error display the error
                                const resultDiv = document.getElementById("uploadResult");
                                if (data.success) {
                                    resultDiv.innerHTML = `<div class="alert alert-success mt-3">Upload successful! ID: ${data.id}</div>`;
                                    form.reset();
                                    location.reload();
                                } else {
                                    let errors = "";
                                    if (typeof data.error === "object") {
                                        for (const [field, messages] of Object.entries(data.error)) {
                                            errors += `<span><strong>${field}:</strong> ${messages.join(", ")}</span>`;
                                        }
                                    } else {
                                        errors = `<span>${data.error}</span>`;
                                    }
                                    resultDiv.innerHTML = `<div class="alert alert-danger mt-3">${errors}</div>`;
                                }
                            } catch (err) {
                                document.getElementById("uploadResult").innerHTML = (
                                    `<div class="alert alert-danger">Unexpected error: ${err}</div>`
                                );
                            }
                        });
                    </script>
                </div>
            </div>
            <div class="row">
                {% for upload in uploads %}
                    <div class="col-12 col-md-6 mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title mb-2">Upload #{{ upload.pk }}</h5>
                                <span class="d-block mb-1">Slug: <strong>{{ upload.slug }}</strong></span>
                                <span class="d-block">
                                    File: <a href="{{ upload.file.url }}">{{ upload.file.name|basename }}</a>
                                </span>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </body>
</html>
